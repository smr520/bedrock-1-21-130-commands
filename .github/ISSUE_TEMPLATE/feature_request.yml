name: 功能请求
description: 提议新的纯命令方块系统、优化方式或兼容改进
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        功能请求应尽量保持网易中国版 1.21.130 的纯原版命令方块。`schedule`、`function` 和 `reload` 在网易命令表中存在，但依赖 Add-on 函数或资源重载，不作为默认隐式依赖。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前玩法、维护或多人场景中的具体问题。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议实现
      description: 写出预期操作、状态载体、触发方式和命令方块预算。
    validations:
      required: true

  - type: dropdown
    id: multiplayer
    attributes:
      label: 多人需求
      options:
        - 单人操作区即可
        - 多人共用一个按钮
        - 每名玩家独立触发
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: persistence
    attributes:
      label: 持久化需求
      options:
        - 不需要跨重进保存
        - 需要跨世界重进保存
        - 需要考虑区块卸载
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考资料
      description: 可列出已经尝试的写法、限制或旧版本方案。

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该需求可以作为纯原版命令方块交付
          required: true
